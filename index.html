<!DOCTYPE html>
<html>
<head>
  <title>Game Menu</title>
  <link rel="stylesheet" href="./home.css">
</head>

<body>
  <div class="menu">

    <img
      src="images/Sprite-start.png"
      alt="Game sprite"
      class="menu-sprite"
    >

    <h2>Main Menu</h2>

    <button class="start-button" onclick="startGame()" aria-label="Start Game">
    <img src="./Sprite-start.png" alt="Start Game">
    </button>
    <button onclick="continueGame()">Continue</button>
    <button onclick="levelSaves()">Level Saves</button>

    <p id="message"></p>
  </div>

  <script src="./script.js"></script>
</body>
</html>
