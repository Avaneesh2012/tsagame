<!DOCTYPE html>
<html>
<head>
<title>Game Menu</title>
<style>
body {
  background: url("Background") center/cover fixed;
  color: white;
  text-align: center;
  font-family: Fantasy;
}
.menu {
  margin-top: 15vh;
}
button {
  display: block;
  margin: 15px auto;
  width: 280px;
  padding: 18px;
  font-size: 20px;
  color: white;
  background: #773b83;
  border: 2px solid #e879bd;
  cursor: pointer;
}
button:hover {
  background: #bd579e;
}
</style>
</head>
<body>
<div class="menu">
  <h1></h1>
  <h2>Main Menu</h2>
  <button onclick="continueGame()">Continue</button>
  <button onclick="newWorld()">Add a New World</button>
  <button onclick="levelSaves()">Level Saves</button>
  <p id="message"></p>
</div>
<script src="script.js"></script>
</body>
</html>
